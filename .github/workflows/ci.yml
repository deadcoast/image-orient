name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Documentation and traceability
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orient-express
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation, catalogs, and traceability
        run: python3 tools/validate_docs.py
      - name: Regenerate dependency graphs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz
          python3 tools/generate_graphs.py
      - name: Fail on stale generated graph sources
        run: git diff --exit-code -- diagrams/*.dot

  build-test:
    name: Build and test (win-x64)
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    defaults:
      run:
        working-directory: orient-express
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: orient-express/global.json
      - name: Restore pinned dependencies (locked mode)
        run: dotnet restore OrientExpress.slnx --locked-mode
      - name: Build (deterministic, warnings as errors)
        run: dotnet build OrientExpress.slnx -c Release --no-restore
      - name: Verify formatting and style
        run: dotnet format OrientExpress.slnx --verify-no-changes --no-restore
      - name: Run unit and architecture tests
        run: dotnet test OrientExpress.slnx -c Release --no-build
